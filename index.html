<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Journey Through Dhaka</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }

        #map {
            height: 100vh;
            width: 100vw;
        }

        .header {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            background: white;
            padding: 15px 30px;
            border-radius: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .header h1 {
            font-size: 24px;
            color: #667eea;
            text-align: center;
        }

        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            z-index: 2000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.8);
            animation: fadeIn 0.3s;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal-content {
            position: relative;
            background-color: white;
            margin: 3% auto;
            padding: 0;
            width: 90%;
            max-width: 800px;
            max-height: 90vh;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 8px 30px rgba(0,0,0,0.3);
            animation: slideIn 0.4s;
        }

        @keyframes slideIn {
            from {
                transform: translateY(-50px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .modal-header {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 20px;
        }

        .modal-header h2 {
            font-size: 24px;
            margin-bottom: 5px;
        }

        .modal-header .date {
            font-size: 14px;
            opacity: 0.9;
        }

        .close {
            position: absolute;
            right: 20px;
            top: 20px;
            color: white;
            font-size: 35px;
            font-weight: bold;
            cursor: pointer;
            z-index: 1;
        }

        .close:hover {
            opacity: 0.8;
        }

        .modal-body {
            padding: 25px;
            max-height: calc(90vh - 150px);
            overflow-y: auto;
        }

        .image-gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .image-gallery img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.3s;
        }

        .image-gallery img:hover {
            transform: scale(1.05);
        }

        .memory-note {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            border-left: 4px solid #667eea;
            line-height: 1.6;
            color: #333;
        }

        /* Custom marker styles */
        .custom-marker {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: 3px solid white;
            box-shadow: 0 3px 10px rgba(0,0,0,0.4);
            cursor: pointer;
            position: relative;
            transition: transform 0.2s;
            object-fit: cover;
            background: white;
        }

        .custom-marker:hover {
            transform: scale(1.15);
            z-index: 1000 !important;
        }

        .marker-number {
            position: absolute;
            bottom: -5px;
            right: -5px;
            background: #667eea;
            color: white;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: bold;
            border: 2px solid white;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }

        .marker-container {
            position: relative;
            width: 60px;
            height: 60px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🌟 Our Journey Through Dhaka 🌟</h1>
    </div>

    <div id="map"></div>

    <!-- Modal -->
    <div id="memoryModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <span class="close">&times;</span>
                <h2 id="modalTitle">Location Name</h2>
                <div class="date" id="modalDate">Date</div>
            </div>
            <div class="modal-body">
                <div class="image-gallery" id="modalImages"></div>
                <div class="memory-note" id="modalNote"></div>
            </div>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        // ============================================
        // CONFIGURATION SECTION - EDIT THIS PART
        // ============================================
        
        const memories = [
            {
                location: "Curzon Hall",
                lat: 23.727361,
                lng: 90.401444,
                date: "February 18, 2019",
                images: [
                    "c:\Users\Rusab\Downloads\photos_map\IMG_20190218_123918.jpg",
                ],
                note: "First time you randomly wanted to take a selfie. After 2nd year's Class party"
            },
            {
                location: "Ahsan Manzil",
                lat: 23.7082,
                lng: 90.4064,
                date: "February 3, 2024",
                images: [
                    "https://via.placeholder.com/400x300/97C4B8/ffffff?text=Memory+3"
                ],
                note: "Exploring the Pink Palace together. You looked amazing standing on those stairs. We learned so much history and took way too many photos! 📸"
            },
            {
                location: "Hatirjheel",
                lat: 23.7525,
                lng: 90.4104,
                date: "March 20, 2024",
                images: [
                    "https://via.placeholder.com/400x300/FFB6C1/ffffff?text=Memory+4",
                    "https://via.placeholder.com/400x300/DDA15E/ffffff?text=Memory+5"
                ],
                note: "Evening boat ride under the city lights. The breeze was perfect, and so was the company. You made a wish on the bridge - I hope it comes true! 🚤✨"
            },
            {
                location: "Dhanmondi Lake",
                lat: 23.7461,
                lng: 90.3742,
                date: "April 10, 2024",
                images: [
                    "https://via.placeholder.com/400x300/BC6C25/ffffff?text=Memory+6"
                ],
                note: "We came back here! Sometimes you just need to revisit the places that mean something. Different season, same awesome friend. 🍃"
            },
            {
                location: "Jamuna Future Park",
                lat: 23.8103,
                lng: 90.4225,
                date: "May 5, 2024",
                images: [
                    "c:\Users\Rusab\Downloads\photos_map\IMG_20190218_123918.jpg",
                    "https://via.placeholder.com/400x300/A7C957/ffffff?text=Memory+8",
                    "https://via.placeholder.com/400x300/F2E8CF/ffffff?text=Memory+9"
                ],
                note: "Shopping spree and food court adventures! We tried that new cafe you'd been wanting to visit. Your laugh echoed through the whole mall when we got lost trying to find the exit. 🛍️😄"
            }
        ];

        // ============================================
        // END OF CONFIGURATION - CODE BELOW
        // ============================================

        let map;
        let markers = [];

        function initMap() {
            // Initialize map centered on Dhaka
            map = L.map('map').setView([23.8103, 90.4125], 12);

            // Add CartoDB map tiles (English labels, clean design)
            L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
                attribution: '© OpenStreetMap contributors © CARTO',
                maxZoom: 19
            }).addTo(map);
            createMarkersAndPath();
        }

        function createMarkersAndPath() {
            const pathCoordinates = [];

            memories.forEach((memory, index) => {
                const position = [memory.lat, memory.lng];
                pathCoordinates.push(position);

                // Create custom marker HTML
                const markerHTML = `
                    <div class="marker-container">
                        <img src="${memory.images[0]}" class="custom-marker" alt="${memory.location}">
                        <div class="marker-number">${index + 1}</div>
                    </div>
                `;

                // Create custom icon
                const customIcon = L.divIcon({
                    html: markerHTML,
                    className: 'custom-marker-wrapper',
                    iconSize: [60, 60],
                    iconAnchor: [30, 30]
                });

                // Add marker to map
                const marker = L.marker(position, { 
                    icon: customIcon,
                    title: memory.location
                }).addTo(map);

                // Add click event
                marker.on('click', () => {
                    openModal(memory);
                });

                markers.push(marker);
            });

            // Create polyline connecting all points
            const polyline = L.polyline(pathCoordinates, {
                color: '#667eea',
                weight: 3,
                opacity: 0.8,
                smoothFactor: 1
            }).addTo(map);

            // Fit map to show all markers
            map.fitBounds(polyline.getBounds(), { padding: [50, 50] });
        }

        function openModal(memory) {
            const modal = document.getElementById('memoryModal');
            const modalTitle = document.getElementById('modalTitle');
            const modalDate = document.getElementById('modalDate');
            const modalImages = document.getElementById('modalImages');
            const modalNote = document.getElementById('modalNote');

            modalTitle.textContent = memory.location;
            modalDate.textContent = memory.date;
            modalNote.textContent = memory.note;

            // Clear and populate images
            modalImages.innerHTML = '';
            memory.images.forEach(imgUrl => {
                const img = document.createElement('img');
                img.src = imgUrl;
                img.alt = memory.location;
                img.onclick = () => window.open(imgUrl, '_blank');
                modalImages.appendChild(img);
            });

            modal.style.display = 'block';
        }

        // Close modal
        document.querySelector('.close').onclick = function() {
            document.getElementById('memoryModal').style.display = 'none';
        }

        window.onclick = function(event) {
            const modal = document.getElementById('memoryModal');
            if (event.target == modal) {
                modal.style.display = 'none';
            }
        }

        // Initialize map when page loads
        window.onload = initMap;
    </script>
</body>
</html>
