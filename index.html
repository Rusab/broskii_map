<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Journey Through Dhaka</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <!-- Leaflet JS - Load synchronously -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- Leaflet Polyline Decorator for arrows -->
    <script src="https://unpkg.com/leaflet-polylinedecorator@1.6.0/dist/leaflet.polylineDecorator.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }

        #map {
            height: 100vh;
            width: 100vw;
        }

        .header {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            background: white;
            padding: 15px 30px;
            border-radius: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .header h1 {
            font-size: 24px;
            color: #667eea;
            text-align: center;
        }

        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            z-index: 2000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.8);
            animation: fadeIn 0.3s;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal-content {
            position: relative;
            background-color: white;
            margin: 3% auto;
            padding: 0;
            width: 90%;
            max-width: 800px;
            max-height: 90vh;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 8px 30px rgba(0,0,0,0.3);
            animation: slideIn 0.4s;
        }

        @keyframes slideIn {
            from {
                transform: translateY(-50px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .modal-header {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 20px;
        }

        .modal-header h2 {
            font-size: 24px;
            margin-bottom: 5px;
        }

        .modal-header .date {
            font-size: 14px;
            opacity: 0.9;
        }

        .close {
            position: absolute;
            right: 20px;
            top: 20px;
            color: white;
            font-size: 35px;
            font-weight: bold;
            cursor: pointer;
            z-index: 1;
        }

        .close:hover {
            opacity: 0.8;
        }

        .modal-body {
            padding: 25px;
            max-height: calc(90vh - 150px);
            overflow-y: auto;
        }

        .image-gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .image-gallery img {
            width: 100%;
            height: auto;
            min-height: 200px;
            max-height: 400px;
            object-fit: contain;
            background: #f0f0f0;
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.3s;
        }

        .image-gallery img:hover {
            transform: scale(1.05);
        }

        .memory-note {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            border-left: 4px solid #667eea;
            line-height: 1.6;
            color: #333;
        }

        /* Custom marker styles */
        .custom-marker {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            border: 3px solid white;
            box-shadow: 0 3px 10px rgba(0,0,0,0.4);
            cursor: pointer;
            position: relative;
            transition: transform 0.2s;
            object-fit: cover;
            background: white;
        }

        .custom-marker:hover {
            transform: scale(1.15);
            z-index: 1000 !important;
        }

        .marker-number {
            position: absolute;
            bottom: -8px;
            right: -8px;
            background: #667eea;
            color: white;
            min-width: 32px;
            height: 32px;
            padding: 0 6px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: bold;
            border: 2px solid white;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
            white-space: nowrap;
        }

        .marker-container {
            position: relative;
            width: 70px;
            height: 70px;
        }

        /* Multiple markers at same location */
        .marker-cluster {
            position: relative;
            cursor: pointer;
        }

        .marker-cluster .custom-marker {
            position: absolute;
            transition: all 0.3s ease;
        }

        .marker-cluster.expanded .custom-marker {
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }

        .marker-cluster .custom-marker:nth-child(1) {
            z-index: 3;
        }

        .marker-cluster .custom-marker:nth-child(2) {
            z-index: 2;
            transform: translate(10px, 10px);
        }

        .marker-cluster .custom-marker:nth-child(3) {
            z-index: 1;
            transform: translate(20px, 20px);
        }

        .marker-cluster.expanded .custom-marker:nth-child(1) {
            transform: translate(-40px, -40px);
        }

        .marker-cluster.expanded .custom-marker:nth-child(2) {
            transform: translate(40px, -40px);
        }

        .marker-cluster.expanded .custom-marker:nth-child(3) {
            transform: translate(0px, 50px);
        }

        .marker-cluster.expanded .custom-marker:nth-child(4) {
            transform: translate(-40px, 50px);
        }

        .marker-cluster.expanded .custom-marker:nth-child(5) {
            transform: translate(40px, 50px);
        }

        /* Journey note popup */
        .journey-popup {
            background: white;
            padding: 15px 20px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            border-left: 4px solid #667eea;
            max-width: 300px;
            font-size: 14px;
            line-height: 1.5;
            color: #333;
        }

        .journey-popup-title {
            font-weight: bold;
            color: #667eea;
            margin-bottom: 8px;
            font-size: 13px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>A Map of Moments</h1>
    </div>

    <div id="map"></div>

    <!-- Modal -->
    <div id="memoryModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <span class="close">&times;</span>
                <h2 id="modalTitle">Location Name</h2>
                <div class="date" id="modalDate">Date</div>
            </div>
            <div class="modal-body">
                <div class="image-gallery" id="modalImages"></div>
                <div class="memory-note" id="modalNote"></div>
            </div>
        </div>
    </div>

    <script>
        // ============================================
        // CONFIGURATION SECTION - EDIT THIS PART
        // ============================================
        
        const memories = [
                {
                    number: -194,
                    location: "Curzon Hall",
                    lat: 23.727361,
                    lng: 90.401444,
                    date: "February 18, 2019",
                    images: ["images/-194.jpg"],
                    note: "The journey didn't start here, when you randomly wanted to take a selfie",
                    
                },
            {
                number: 1,  // Skip to 50!
                location: "Crimson Cup",
                lat: 23.738824, 
                lng: 90.378759,
                date: "August 31, 2019",
                images: ["images/0.jpg"],
                note: "Everyone canceled, except us. And that's where the journey began. We sat in crimson cup for an hour after the movie, because you had to pick Urbi from college. We talked about entropy and random stuff. I took a random photo and sent mehrin. Mehrin said Me Crimson cup and you were two things she never thought would collide.",
                journeyNote: "194 days passed since this selfie. On one random day, you decided to ask me to go on a hangout with you guys. And on an eventual hangout all of us decided to go watch Spider Man: Far from home."
            },

            {
                number: 27,
                location: "Pizza Burg",
                lat: 23.747459,
                lng:  90.370319,
                date: "September 26, 2019",
                images: ["images/27.jpg"],
                note: "Everyone went to pizza burg",
                
            },
            {
                    number: -194,
                    location: "Curzon Hall",
                    lat: 23.727361,
                    lng: 90.401444,
                    date: "Oct 1, 2019",
                    images: ["images/32.jpg"],
                    note: "The journey didn't start here, when you randomly wanted to take a selfie",
                    
                },
            {
                    number: 50,
                    location: "TSC",
                    lat: 23.731748, 
                    lng: 90.395574,
                    date: "Oct 19, 2019",
                    images: ["images/50.jpg"],
                    note: "First time I celebrated your birthday. Gave you a earphone, probably the first gift I ever gave you.",
                    
                },
            {
                    number: 74,
                    location: "Second Cup",
                    lat: 23.747519, 
                    lng: 90.365398,
                    date: "Oct 19, 2019",
                    images: ["images/74.jpg"],
                    note: "The day you lost your earphone.",
                    
                },
        ];

        // ============================================
        // END OF CONFIGURATION - CODE BELOW
        // ============================================

        let map;
        let markers = [];

        function initMap() {
            // Initialize map centered on Dhaka
            map = L.map('map').setView([23.8103, 90.4125], 12);

            // Add CartoDB map tiles (English labels, clean design)
            L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
                attribution: '© OpenStreetMap contributors © CARTO',
                maxZoom: 19
            }).addTo(map);

            createMarkersAndPath();
        }

        function createMarkersAndPath() {
            const pathCoordinates = [];
            const pathSegments = [];
            const segmentsWithNotes = []; // Track which segments have notes
            
            // Group memories by location
            const locationGroups = {};
            memories.forEach((memory, index) => {
                const key = `${memory.lat.toFixed(5)},${memory.lng.toFixed(5)}`;
                if (!locationGroups[key]) {
                    locationGroups[key] = [];
                }
                locationGroups[key].push({ memory, index });
            });

            memories.forEach((memory, index) => {
                const position = [memory.lat, memory.lng];
                pathCoordinates.push(position);

                // Create line segment if not the first point
                if (index > 0) {
                    const prevPosition = [memories[index - 1].lat, memories[index - 1].lng];
                    const hasNote = memory.journeyNote ? true : false;
                    
                    const segment = L.polyline([prevPosition, position], {
                        color: hasNote ? '#ff6b9d' : '#667eea', // Pink if has note, purple otherwise
                        weight: hasNote ? 4 : 3,
                        opacity: 0.8,
                        smoothFactor: 1
                    }).addTo(map);

                    // Add click event if this memory has a journey note
                    if (memory.journeyNote) {
                        segment.on('click', function(e) {
                            const popupContent = `
                                <div class="journey-popup">
                                    <div class="journey-popup-title">🚶 Journey: ${memories[index - 1].number} → ${memory.number}</div>
                                    ${memory.journeyNote}
                                </div>
                            `;
                            L.popup()
                                .setLatLng(e.latlng)
                                .setContent(popupContent)
                                .openOn(map);
                        });

                        segment.on('mouseover', function() {
                            this.setStyle({ weight: 6, opacity: 1 });
                        });
                        segment.on('mouseout', function() {
                            this.setStyle({ weight: 4, opacity: 0.8 });
                        });
                        
                        segmentsWithNotes.push({ start: index - 1, end: index });
                    }

                    pathSegments.push(segment);
                }
            });

            // Create markers - grouped by location
            Object.values(locationGroups).forEach(group => {
                const position = [group[0].memory.lat, group[0].memory.lng];
                
                if (group.length === 1) {
                    // Single marker at this location
                    const memory = group[0].memory;
                    const markerHTML = `
                        <div class="marker-container">
                            <img src="${memory.images[0]}" class="custom-marker" alt="${memory.location}">
                            <div class="marker-number">${memory.number}</div>
                        </div>
                    `;

                    const customIcon = L.divIcon({
                        html: markerHTML,
                        className: 'custom-marker-wrapper',
                        iconSize: [70, 70],
                        iconAnchor: [35, 35]
                    });

                    const marker = L.marker(position, { 
                        icon: customIcon,
                        title: memory.location
                    }).addTo(map);

                    marker.on('click', () => {
                        openModal(memory);
                    });

                    markers.push(marker);
                } else {
                    // Multiple markers at same location - create cluster
                    let clusterHTML = '<div class="marker-cluster" id="cluster-' + position[0] + '-' + position[1] + '">';
                    
                    group.forEach((item, idx) => {
                        const memory = item.memory;
                        clusterHTML += `
                            <div class="marker-container" data-memory-index="${item.index}">
                                <img src="${memory.images[0]}" class="custom-marker" alt="${memory.location}">
                                <div class="marker-number">${memory.number}</div>
                            </div>
                        `;
                    });
                    
                    clusterHTML += '</div>';

                    const customIcon = L.divIcon({
                        html: clusterHTML,
                        className: 'custom-marker-wrapper',
                        iconSize: [70, 70],
                        iconAnchor: [35, 35]
                    });

                    const marker = L.marker(position, { 
                        icon: customIcon,
                        title: group[0].memory.location
                    }).addTo(map);

                    // Handle cluster clicks
                    marker.on('click', (e) => {
                        const clusterEl = e.target._icon.querySelector('.marker-cluster');
                        const isExpanded = clusterEl.classList.contains('expanded');
                        
                        // Close all other expanded clusters
                        document.querySelectorAll('.marker-cluster.expanded').forEach(el => {
                            el.classList.remove('expanded');
                        });
                        
                        if (!isExpanded) {
                            clusterEl.classList.add('expanded');
                            
                            // Add click handlers to individual markers in cluster
                            setTimeout(() => {
                                clusterEl.querySelectorAll('.marker-container').forEach(markerDiv => {
                                    markerDiv.onclick = (evt) => {
                                        evt.stopPropagation();
                                        const memoryIndex = parseInt(markerDiv.getAttribute('data-memory-index'));
                                        openModal(memories[memoryIndex]);
                                        clusterEl.classList.remove('expanded');
                                    };
                                });
                            }, 50);
                        }
                    });

                    markers.push(marker);
                }
            });

            // Create arrows - different colors for segments with notes
            pathCoordinates.forEach((coord, index) => {
                if (index > 0) {
                    const hasNote = segmentsWithNotes.some(seg => seg.start === index - 1 && seg.end === index);
                    const segmentPath = L.polyline([pathCoordinates[index - 1], coord], {
                        color: 'transparent',
                        weight: 0
                    }).addTo(map);

                    const decorator = L.polylineDecorator(segmentPath, {
                        patterns: [
                            {
                                offset: '50%',
                                repeat: 0,
                                symbol: L.Symbol.arrowHead({
                                    pixelSize: 14,
                                    polygon: false,
                                    pathOptions: {
                                        stroke: true,
                                        color: hasNote ? '#ff6b9d' : '#667eea', // Pink if has note
                                        weight: 3,
                                        opacity: 0.9
                                    }
                                })
                            }
                        ]
                    }).addTo(map);
                }
            });

            // Fit map to show all markers
            if (pathCoordinates.length > 0) {
                map.fitBounds(pathCoordinates, { padding: [50, 50] });
            }
        }

        function openModal(memory) {
            const modal = document.getElementById('memoryModal');
            const modalTitle = document.getElementById('modalTitle');
            const modalDate = document.getElementById('modalDate');
            const modalImages = document.getElementById('modalImages');
            const modalNote = document.getElementById('modalNote');

            modalTitle.textContent = memory.location;
            modalDate.textContent = memory.date;
            modalNote.textContent = memory.note;

            // Clear and populate images
            modalImages.innerHTML = '';
            memory.images.forEach(imgUrl => {
                const img = document.createElement('img');
                img.src = imgUrl;
                img.alt = memory.location;
                img.onclick = () => window.open(imgUrl, '_blank');
                modalImages.appendChild(img);
            });

            modal.style.display = 'block';
        }

        // Close modal
        document.querySelector('.close').onclick = function() {
            document.getElementById('memoryModal').style.display = 'none';
        }

        window.onclick = function(event) {
            const modal = document.getElementById('memoryModal');
            if (event.target == modal) {
                modal.style.display = 'none';
            }
        }

        // Initialize map when page loads
        window.onload = initMap;
    </script>
</body>
</html>
